name: Generar lockfile

# Genera y commitea package-lock.json cuando falta (el repo se creó sin poder instalar en local).
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/lockfile.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commitear si ha cambiado
        run: |
          if git diff --quiet --exit-code -- package-lock.json 2>/dev/null && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json al día"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generar package-lock.json"
          git push
